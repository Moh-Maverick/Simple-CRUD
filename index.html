<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple CRUD with FastAPI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        form {
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .message {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Simple CRUD with FastAPI and MySQL</h1>

    <div id="message"></div>

    <form id="userForm">
        <input type="hidden" id="userId">
        <label for="name">Name:</label>
        <input type="text" id="name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" required>
        <button type="submit" id="submitBtn">Create</button>
    </form>

    <h2>Users</h2>
    <table id="usersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const apiUrl = 'http://localhost:8000';
        const form = document.getElementById('userForm');
        const messageDiv = document.getElementById('message');
        const tableBody = document.querySelector('#usersTable tbody');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('userId').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            const userData = { name, email };

            try {
                let response;
                if (userId) {
                    response = await fetch(`${apiUrl}/users/${userId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(userData)
                    });
                } else {
                    response = await fetch(`${apiUrl}/users`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(userData)
                    });
                }

                if (response.ok) {
                    showMessage('Operation successful', 'message');
                    form.reset();
                    document.getElementById('userId').value = '';
                    document.getElementById('submitBtn').textContent = 'Create';
                    loadUsers();
                } else {
                    showMessage('Error: ' + response.statusText, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        });

        async function loadUsers() {
            try {
                const response = await fetch(`${apiUrl}/users`);
                const users = await response.json();
                tableBody.innerHTML = '';
                users.forEach(user => {
                    const row = tableBody.insertRow();
                    row.insertCell().textContent = user.id;
                    row.insertCell().textContent = user.name;
                    row.insertCell().textContent = user.email;
                    const actionsCell = row.insertCell();
                    actionsCell.innerHTML = `
                        <button onclick="editUser(${user.id}, '${user.name}', '${user.email}')">Edit</button>
                        <button onclick="deleteUser(${user.id})">Delete</button>
                    `;
                });
            } catch (error) {
                showMessage('Error loading users: ' + error.message, 'error');
            }
        }

        function editUser(id, name, email) {
            document.getElementById('userId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('email').value = email;
            document.getElementById('submitBtn').textContent = 'Update';
        }

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                try {
                    const response = await fetch(`${apiUrl}/users/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        showMessage('User deleted', 'message');
                        loadUsers();
                    } else {
                        showMessage('Error deleting user', 'error');
                    }
                } catch (error) {
                    showMessage('Error: ' + error.message, 'error');
                }
            }
        }

        function showMessage(text, className) {
            messageDiv.textContent = text;
            messageDiv.className = className;
            setTimeout(() => messageDiv.textContent = '', 3000);
        }

        loadUsers();
    </script>
</body>

</html>
